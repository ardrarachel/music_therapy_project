<!DOCTYPE html>
<html>

<head>
    <title>Multimodal Music Therapy AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">
        <h1>Multimodal Music Therapy AI</h1>
        <h2 id="question">How are you feeling today?</h2>

        <div class="media-container">
            <!-- Camera -->
            <video id="video" autoplay muted playsinline></video>
        </div>

        <div class="controls">
            <!-- Manual Text Input -->
            <textarea id="userText" placeholder="Or type how you feel here..." rows="2"
                style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea>

            <!-- Voice -->
            <button id="recordBtn">
                <span>🎤</span> Start Speaking
            </button>
        </div>

        <div class="status-box">
            <p id="status">Waiting for your response...</p>
            <p><b>Detected Emotion:</b> <span id="emotion">Neutral</span></p>
        </div>

        <audio id="musicPlayer" controls></audio>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
